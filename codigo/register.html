<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Registro - DeltaHub</title>
</head>
<body>
    <header>
        <a href="index.html" id="shadow">home</a>
        <a href="" id="shadow">saves</a>
        <a href="" id="shadow">forum</a>
        <a href="" id="shadow">lorem impsumdp</a>
        <a href="login.html" id="shadow">login</a>
    </header>

    <main class="form-card">
        <h1>REGISTER</h1>

        <form id="auth-form" data-mode="register">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" autocomplete="username">

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="new-password">

            <label for="confirm">Confirmar contraseña</label>
            <input type="password" id="confirm" name="confirm" autocomplete="new-password">

            <p id="msg" class="msg"></p>

            <button type="submit" class="btn">CREAR CUENTA</button>
        </form>

        <p class="switch">¿Ya tenés cuenta? <a href="login.html">Iniciá sesión acá</a></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
