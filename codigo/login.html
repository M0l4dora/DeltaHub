<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login - DeltaHub</title>
</head>
<body>
    <header>
          <a href="index.html"  class="header-logo-LoginRegister">
            <img src="/codigo/imagenes/DeltahubLogo3px.png" alt="logo deltahub">
        </a>
        <a href="index.html" id="shadow">Principal</a>
        <a href="" id="shadow">Workshop</a>
        <a href="" id="shadow">Comunidad</a>
        <div class="auth">
            <a href="login.html" id="shadow">Login</a>
            <a href="register.html" id="shadow">Signup</a>
        </div>
    </header>

    <main class="form-card">
        <h1>LOGIN</h1>

        <form id="auth-form" data-mode="login">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" autocomplete="username">

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="current-password">

            <p id="msg" class="msg"></p>

            <button type="submit" class="btn">ENTRAR</button>
        </form>

        <p class="switch">¿No tenés cuenta? <a href="register.html">Registrate acá</a></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
